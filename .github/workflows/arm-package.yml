name: Build merged touchscreen package

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'backend/**'
      - 'features/**'
      - 'runtime/**'
      - 'build/**'
      - 'installation/**'
      - 'assets/**'
      - 'developer-tools/**'
      - 'tests/**'
      - 'LICENSE'
      - '.github/workflows/arm-package.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merged-arm-package
  cancel-in-progress: true

env:
  # Updating this pin also updates the install.sh/VERSION package fingerprints.
  INTEGRATION_REF: a382595d8f6f4c9f88220ba50354767fae9f2fac

jobs:
  build:
    name: Build and test merged main
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out merged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: component
          persist-credentials: false
      - name: Check out pinned installer context
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: carmanspb/K2-OpenKlipper
          ref: ${{ env.INTEGRATION_REF }}
          path: integration
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: component/developer-tools/package-lock.json
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
            imagemagick libx11-dev clang-format
          python -m pip install pillow cffi
          npm ci --ignore-scripts --prefix component/developer-tools
      - name: Generate assets and check C formatting
        working-directory: component
        run: |
          python developer-tools/build_assets.py --dependencies developer-tools
          # ImageMagick otherwise embeds generation times in identical PNGs.
          mogrify -define png:exclude-chunks=date,time assets/generated/*.png
          sh developer-tools/format.sh --check
      - name: Build host simulator
        working-directory: component
        run: |
          cmake -S build -B out/host -DCMAKE_BUILD_TYPE=Release
          cmake --build out/host --parallel 4
      - name: Run regression and feature tests
        working-directory: component
        run: |
          ln -s integration/install.sh ../install.sh
          python -m unittest discover -s tests -v
          PYTHONPATH="$PWD/backend:$PWD/tests" \
            python -m unittest discover -s features/cartographer-toggle/tests -v
      - name: Build and validate ARM package
        working-directory: component
        run: |
          cmake -S build -B out/arm -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/build/arm-linux.cmake"
          cmake --build out/arm --parallel 4
          python developer-tools/package_arm.py --build out/arm --integration-root ../integration
          python installation/validate_package.py --source . \
            --package precompiled/armv7 --integration-root ../integration
          git diff --exit-code -- . ':!precompiled/armv7'
          tar -czf ../touchscreen-armv7.tar.gz -C precompiled armv7
      - name: Upload validated package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: touchscreen-armv7-${{ github.sha }}
          path: touchscreen-armv7.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Open package refresh PR
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Check that this is still the latest main
        id: current
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              ...context.repo, ref: 'heads/main'
            });
            core.setOutput('fresh', data.object.sha === context.sha);
            if (data.object.sha !== context.sha) {
              core.notice('main advanced; its newer run will refresh the package.');
            }
      - name: Check out the tested main commit
        if: steps.current.outputs.fresh == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: component
          persist-credentials: false
      - name: Check out the same installer context
        if: steps.current.outputs.fresh == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: carmanspb/K2-OpenKlipper
          ref: ${{ env.INTEGRATION_REF }}
          path: integration
          persist-credentials: false
      - name: Download validated package
        if: steps.current.outputs.fresh == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: touchscreen-armv7-${{ github.sha }}
          path: package-artifact
      - name: Verify package against the publishing checkout
        if: steps.current.outputs.fresh == 'true'
        working-directory: component
        run: |
          rm -rf precompiled/armv7
          tar -xzf ../package-artifact/touchscreen-armv7.tar.gz -C precompiled
          python3 installation/validate_package.py --source . \
            --package precompiled/armv7 --integration-root ../integration
      - name: Create or update package refresh PR
        if: steps.current.outputs.fresh == 'true'
        id: package-pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: component
          base: main
          branch: automation/arm-package
          add-paths: precompiled/armv7
          commit-message: Refresh tested ARM package for ${{ github.sha }}
          title: Refresh precompiled ARM touchscreen package
          body: |
            Updates the tracked ARM bundle from merged main commit `${{ github.sha }}`.

            Host and ARM builds, C formatting, the main regression suite,
            Cartographer feature tests and package integrity validation passed.
            No live printer commands were run.

            [Build and downloadable package](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          delete-branch: true
      - name: Record validation on the generated commit
        if: steps.package-pr.outputs.pull-request-head-sha != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PACKAGE_SHA: ${{ steps.package-pr.outputs.pull-request-head-sha }}
        with:
          script: |
            // Only attest the exact tested source plus its generated package.
            const [base, generated] = await Promise.all([
              github.rest.git.getRef({ ...context.repo, ref: 'heads/main' }),
              github.rest.repos.getCommit({ ...context.repo, ref: process.env.PACKAGE_SHA })
            ]);
            if (base.data.object.sha !== context.sha ||
                generated.data.parents[0]?.sha !== context.sha) {
              core.notice('main advanced during publication; the newer build must validate this PR.');
              return;
            }
            // GITHUB_TOKEN commits do not trigger another PR workflow run.
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.PACKAGE_SHA,
              state: 'success',
              context: 'touchscreen/package',
              description: 'Merged source built, tested and packaged successfully',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
